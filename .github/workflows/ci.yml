name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  # Build tools the workflow installs, pinned (build-plan step 12,
  # ARCHITECTURE.md D-69). Every action above is pinned to a commit, with
  # the tag it was read from beside it; a bump is a reviewed change here.
  GOVULNCHECK_VERSION: v1.8.0
  GORELEASER_VERSION: v2.18.2
  APPIMAGETOOL_VERSION: '1.9.1'
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each runner runs the full test suite natively and builds the
          # binaries for its own OS. The ubuntu runner additionally
          # cross-compiles all four targets with `make build`, which is the
          # release path. darwin/amd64 is built on the arm64 macOS runner
          # (Go cross-compiles; there is no Intel runner to rely on) and
          # smoke-tested under Rosetta when that is available.
          - os: ubuntu-latest
            targets: 'linux/amd64'
          - os: macos-latest
            targets: 'darwin/arm64 darwin/amd64'
          - os: windows-latest
            targets: 'windows/amd64'

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # git describe needs the tags for the version stamp

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Version
        id: version
        shell: bash
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - name: UI — install
        working-directory: ui
        run: npm ci

      - name: UI — type-check and build (produces internal/server/ui/dist)
        working-directory: ui
        run: npm run build

      - name: UI — tests
        working-directory: ui
        run: npm test

      - name: Go — gofmt
        if: runner.os != 'Windows' # the Windows checkout may rewrite line endings
        shell: bash
        run: |
          out=$(gofmt -l cmd internal scripts data)
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi

      - name: Go — vet
        run: go vet ./...

      - name: Go — tests (UI embedded)
        run: go test ./...

      - name: Go — tests (no UI, the make dev configuration)
        run: go test -tags noui ./...

      - name: Build ${{ matrix.targets }}
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          for t in ${{ matrix.targets }}; do
            os=${t%/*}; arch=${t#*/}; ext=""
            [ "$os" = windows ] && ext=.exe
            echo "building dist/advisor-$os-$arch$ext"
            GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X advisor/internal/version.Version=${{ steps.version.outputs.version }}" \
              -o "dist/advisor-$os-$arch$ext" ./cmd/advisor
          done
          ls -la dist

      - name: Smoke test — each binary starts, answers /api/health, /api/hardware, /api/recommend and /api/bench/history, serves the UI
        shell: bash
        env:
          ADVISOR_DATA_DIR: ${{ runner.temp }}/advisor-smoke
        run: |
          for t in ${{ matrix.targets }}; do
            os=${t%/*}; arch=${t#*/}; ext=""
            [ "$os" = windows ] && ext=.exe
            bin="dist/advisor-$os-$arch$ext"
            if [ "$os" = darwin ] && [ "$arch" = amd64 ] && ! arch -x86_64 true 2>/dev/null; then
              echo "no Rosetta on this runner; skipping the darwin/amd64 smoke test"; continue
            fi
            echo "== $bin"
            "$bin" -version
            "$bin" -port 27182 -no-browser &
            pid=$!
            for i in $(seq 1 30); do
              curl -sf http://127.0.0.1:27182/api/health >/dev/null && break
              sleep 1
            done
            curl -sf http://127.0.0.1:27182/api/health; echo
            curl -sf http://127.0.0.1:27182/ | grep -qi '<!doctype html>'
            curl -sf http://127.0.0.1:27182/settings | grep -qi '<!doctype html>'
            # A foreign Host header must be refused (product rule 7's second line of defence).
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example.com' http://127.0.0.1:27182/api/health)
            [ "$code" = 421 ] || { echo "expected 421 for a foreign Host, got $code"; kill $pid; exit 1; }
            # Only the daemon's own origin is answered (D-67): another port on this computer is another origin.
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Origin: http://127.0.0.1:5173' http://127.0.0.1:27182/api/data/delete)
            [ "$code" = 403 ] || { echo "expected 403 for a foreign Origin, got $code"; kill $pid; exit 1; }
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Sec-Fetch-Site: cross-site' http://127.0.0.1:27182/api/health)
            [ "$code" = 403 ] || { echo "expected 403 for a cross-site request, got $code"; kill $pid; exit 1; }
            curl -sfI http://127.0.0.1:27182/ | grep -qi "^content-security-policy: default-src 'none'" || { echo "the UI has no Content-Security-Policy"; kill $pid; exit 1; }
            # This runner's hardware, as the daemon detected and stored it on start
            # (step 2). The request waits while detection is still running.
            curl -sf --max-time 120 http://127.0.0.1:27182/api/hardware || { echo "GET /api/hardware failed"; kill $pid; exit 1; }
            echo
            # What the advisor says to this runner (step 5). The model list has not
            # been fetched here, so the honest answer is "nothing to recommend from
            # yet" — the point is that the endpoint answers on every OS.
            "$bin" recommend -port 27182 -purposes chat,coding || { echo "advisor recommend failed"; kill $pid; exit 1; }
            # The benchmark history (step 6): no Ollama on a runner, so no runs —
            # the point is that the harness is wired and its table answers.
            "$bin" bench -port 27182 -history || { echo "advisor bench -history failed"; kill $pid; exit 1; }
            kill $pid || true
            wait $pid 2>/dev/null || true
          done

      - name: Cross-compile every target (the release path)
        if: runner.os == 'Linux'
        run: make build VERSION=${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: advisor-${{ matrix.os }}
          path: dist/advisor-*
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Build-plan step 12: the dependencies' known vulnerabilities, on every
  # push. govulncheck reports only vulnerabilities in code the daemon can
  # actually reach, for each OS it ships to; npm audit covers the UI's
  # whole tree (its build tools make the embedded UI). `go mod verify`
  # checks every module against go.sum.
  security:
    name: security (dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Go — modules match go.sum
        run: go mod verify

      - name: Go — known vulnerabilities (linux, darwin, windows)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          for os in linux darwin windows; do
            echo "== GOOS=$os"
            GOOS=$os "$(go env GOPATH)/bin/govulncheck" -tags noui ./...
          done

      - name: UI — install exactly the locked versions
        working-directory: ui
        run: npm ci

      - name: UI — known vulnerabilities
        working-directory: ui
        run: npm audit --audit-level=moderate

  # ---------------------------------------------------------------------
  # Build-plan step 11: cutting a release. `release` publishes the GitHub
  # Release itself (binaries, checksums, the .deb — everything
  # .goreleaser.yaml's own comment says GoReleaser OSS can build). The
  # three jobs after it each attach one more OS's hand-rolled artifact
  # (macOS .app/.dmg, Windows installer, Linux AppImage) to that same
  # release with `gh release upload` — none of the four exists without a
  # `v*` tag; RELEASING.md is the human-facing walkthrough of this whole
  # sequence, including the secrets table these jobs are already wired to
  # look for.

  release:
    name: release (GoReleaser)
    runs-on: ubuntu-latest
    needs: [build, security]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # tags + full history: GoReleaser's own changelog and version detection need it

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package-macos:
    name: package (macOS .app + .dmg)
    runs-on: macos-latest
    needs: [build, release]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Version
        id: version
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: advisor-macos-latest
          path: dist

      - run: chmod +x dist/advisor-darwin-arm64 dist/advisor-darwin-amd64

      # Ad-hoc signs unless every one of these five secrets is set, in
      # which case build_app.sh (see its own header comment) imports the
      # real Developer ID Application certificate, signs with the
      # hardened runtime, and notarizes + staples — inert until Itay
      # actually adds them (RELEASING.md's secrets table), no workflow
      # change needed on that day.
      - name: Build Local LLM Advisor.app
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          mkdir -p dist/macos
          packaging/macos/build_app.sh "${{ steps.version.outputs.version }}" dist/macos dist/advisor-darwin-arm64 dist/advisor-darwin-amd64

      - name: Build the .dmg
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: packaging/macos/build_dmg.sh "dist/macos/Local LLM Advisor.app" "dist/macos/Local LLM Advisor.dmg"

      - name: Upload onto the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # With its SHA-256 beside it: GoReleaser's checksums.txt covers only
        # the files GoReleaser built (D-69), so each packaged file carries
        # its own.
        run: |
          (cd dist/macos && shasum -a 256 "Local LLM Advisor.dmg" > "Local LLM Advisor.dmg.sha256")
          gh release upload "${{ github.ref_name }}" "dist/macos/Local LLM Advisor.dmg" "dist/macos/Local LLM Advisor.dmg.sha256" --clobber

  package-windows:
    name: package (Windows installer)
    runs-on: windows-latest
    needs: [build, release]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    # `if:` conditions can't read the secrets context directly (actionlint
    # catches this — "context 'secrets' is not allowed here"); a job-level
    # env var populated from the secret is the documented workaround, and
    # what the two signed/unsigned steps below branch on instead.
    env:
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERT_BASE64 != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Version
        id: version
        shell: bash
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: advisor-windows-latest
          path: dist

      # windows-latest doesn't reliably ship Inno Setup (open runner-images
      # issues confirm it isn't guaranteed); installing it here is cheap
      # and keeps the dependency explicit rather than hoped-for.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Decode the code-signing certificate
        if: ${{ env.HAS_WINDOWS_CERT == 'true' }}
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\codesign.pfx", $bytes)

      # Signed path: needs signtool.exe (ships with the Windows SDK already
      # on this image) and the decoded .pfx above. Inert until Itay adds
      # WINDOWS_CERT_BASE64/WINDOWS_CERT_PASSWORD (RELEASING.md's secrets
      # table) — no workflow change needed that day, same promise as macOS.
      - name: Compile the installer (signed)
        if: ${{ env.HAS_WINDOWS_CERT == 'true' }}
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          iscc /DSIGN "/DMyAppVersion=${{ steps.version.outputs.version }}" "/DSourceExePath=dist\advisor-windows-amd64.exe" `
            "/Ssigntool=signtool.exe sign /f $env:RUNNER_TEMP\codesign.pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `$f" `
            packaging\windows\setup.iss

      - name: Compile the installer (unsigned)
        if: ${{ env.HAS_WINDOWS_CERT != 'true' }}
        shell: pwsh
        run: iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" "/DSourceExePath=dist\advisor-windows-amd64.exe" packaging\windows\setup.iss

      - name: Upload onto the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          f="LocalLLMAdvisor-Setup-${{ steps.version.outputs.version }}.exe"
          (cd dist && sha256sum "$f" > "$f.sha256")
          gh release upload "${{ github.ref_name }}" "dist/$f" "dist/$f.sha256" --clobber

  package-linux-appimage:
    name: package (Linux AppImage)
    runs-on: ubuntu-latest
    needs: [build, release]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Version
        id: version
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: advisor-ubuntu-latest
          path: dist

      - run: chmod +x dist/advisor-linux-amd64

      # The package name changed between Ubuntu releases (libfuse2 ->
      # libfuse2t64); try both rather than pin the runner to one.
      - name: Install appimagetool + FUSE
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64
          # A pinned release, checked against its SHA-256 before it runs —
          # never the moving "continuous" build: what builds the customer's
          # download is itself a reviewed input (D-69).
          curl -fsSL -o /tmp/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          echo "${APPIMAGETOOL_SHA256}  /tmp/appimagetool" | sha256sum -c -
          sudo install -m 0755 /tmp/appimagetool /usr/local/bin/appimagetool

      - name: Build the AppImage
        run: packaging/linux/build_appimage.sh dist/advisor-linux-amd64 "dist/LocalLLMAdvisor-${{ steps.version.outputs.version }}-x86_64.AppImage"

      - name: Upload onto the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          f="LocalLLMAdvisor-${{ steps.version.outputs.version }}-x86_64.AppImage"
          (cd dist && sha256sum "$f" > "$f.sha256")
          gh release upload "${{ github.ref_name }}" "dist/$f" "dist/$f.sha256" --clobber
